<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  html,body{margin:0;background:#22303a;overflow:hidden}
  #grid{display:grid;grid-template-columns:repeat(5,300px);grid-auto-rows:300px}
  canvas{width:100%;height:100%}
  .cell{position:relative;border:1px solid #000}
  .lbl{position:absolute;left:4px;top:4px;color:#fff;font:12px monospace;text-shadow:0 0 3px #000;z-index:2}
</style>
</head>
<body>
<div id="grid"></div>
<script type="importmap">
{
  "imports": {
    "three": "/node_modules/three/build/three.module.js",
    "three/addons/": "/node_modules/three/examples/jsm/"
  }
}
</script>
<script type="module">
/* Контактный лист Synty GLB: ?files=a.glb,b.glb&dir=rivals|heroes */
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

const q = new URLSearchParams(location.search);
const dir = q.get('dir') ?? 'rivals';
const files = (q.get('files') ?? '').split(',').filter(Boolean);
const BASE = dir === 'rivals' ? '/public/models/rig/rivals/' : '/public/models/rig/heroes/';

const grid = document.getElementById('grid');
const scene = new THREE.Scene();
const cam = new THREE.PerspectiveCamera(35, 1, 0.1, 50);
const key = new THREE.DirectionalLight(0xffffff, 2.2); key.position.set(2, 4, 3); scene.add(key);
scene.add(new THREE.AmbientLight(0x8899aa, 1.2));
const hemi = new THREE.HemisphereLight(0xcfe8ff, 0x3a2f22, 0.8); scene.add(hemi);

const loader = new GLTFLoader();
const mixers = [];
const pending = [];
for (const f of files) {
  const cell = document.createElement('div'); cell.className = 'cell';
  const lbl = document.createElement('div'); lbl.className = 'lbl'; lbl.textContent = f;
  cell.appendChild(lbl);
  const cv = document.createElement('canvas'); cv.width = 300; cv.height = 300;
  cell.appendChild(cv);
  grid.appendChild(cell);

  pending.push(loader.loadAsync(BASE + f).then((g) => {
    const sc = g.scene;
    sc.traverse((o) => { if (o.isSkinnedMesh) o.frustumCulled = false; });
    const box = new THREE.Box3().setFromObject(sc);
    const h = Math.max(box.max.y - box.min.y, 0.01);
    const c = box.getCenter(new THREE.Vector3());
    sc.position.x -= c.x; sc.position.z -= c.z; sc.position.y -= box.min.y;
    const gr = new THREE.Mesh(new THREE.CircleGeometry(Math.max(h * 0.55, 0.3), 24),
      new THREE.MeshBasicMaterial({ color: 0x3a4a55 }));
    gr.rotation.x = -Math.PI / 2; sc.add(gr);
    /* свет В сцену модели (рендерим sc напрямую) */
    const key2 = new THREE.DirectionalLight(0xffffff, 2.2); key2.position.set(2, 4, 3); sc.add(key2);
    sc.add(new THREE.AmbientLight(0x8899aa, 1.4));
    sc.add(new THREE.HemisphereLight(0xcfe8ff, 0x3a2f22, 0.9));
    const mixer = (g.animations.length && q.get('anim') !== '0') ? new THREE.AnimationMixer(sc) : null;
    if (mixer) {
      const clip = g.animations.find((a) => a.name === 'idle') ?? g.animations[0];
      mixer.clipAction(clip).play();
      mixers.push(mixer);
    }
    cam.position.set(0, h * 0.62, h * 1.75);
    cam.lookAt(0, h * 0.48, 0);
    const r2 = new THREE.WebGLRenderer({ canvas: cv, antialias: true });
    r2.setSize(300, 300, false);
    r2.outputColorSpace = THREE.SRGBColorSpace;
    cell._r = r2; cell._s = sc;
    return f;
  }).catch((e) => { lbl.textContent = 'ERR ' + f; lbl.style.color = '#f66'; console.error(f, e); }));
}

await Promise.all(pending);
document.title = 'READY';

function loop() {
  const dt = 1 / 60;
  for (const m of mixers) m.update(dt);
  for (const cell of grid.children) if (cell._r) cell._r.render(cell._s, cam);
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
